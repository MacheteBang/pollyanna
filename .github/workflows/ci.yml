name: CI

# Every pull request and every push to main runs the checks. Pushing a tag vX.Y.Z runs them, then
# publishes the image to the GitHub Container Registry, tagged X.Y.Z, the commit SHA and latest.
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Branch protection on main requires this job by name.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # A model change without its migration fails here rather than at the operator's first start.
      - name: Migrations match the model
        run: |
          dotnet tool restore
          dotnet restore
          dotnet ef migrations has-pending-model-changes --project src/Pollyanna

      # Every test host watches files (config, wwwroot, asp-append-version). Parallel tests can
      # exhaust a low per-user inotify limit (often 128); polling avoids inotify altogether.
      - name: Test
        env:
          DOTNET_USE_POLLING_FILE_WATCHER: '1'
        run: dotnet test

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # The SDK builds the image and talks to the registry API itself; no Docker daemon needed.
      # The repository and the source and documentation labels come from this repo, never from
      # the source. The workflow's own GITHUB_TOKEN can push packages, so no secret is needed.
      - name: Build and push image
        env:
          DOTNET_CONTAINER_REGISTRY_UNAME: ${{ github.actor }}
          DOTNET_CONTAINER_REGISTRY_PWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          version="${GITHUB_REF_NAME#v}"
          source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          dotnet publish src/Pollyanna/Pollyanna.csproj \
            -c Release \
            -t:PublishContainer \
            -p:Version="$version" \
            -p:PublishRepositoryUrl=true \
            -p:PrivateRepositoryUrl="$source" \
            -p:ContainerDocumentationUrl="$source/blob/$GITHUB_REF_NAME/DEPLOYMENT.md" \
            -p:ContainerRegistry=ghcr.io \
            -p:ContainerRepository="$repository" \
            "-p:ContainerImageTags=\"$version;${GITHUB_SHA};latest\""
