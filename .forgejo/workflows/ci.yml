name: CI

# Every pull request and every push to main runs the checks. Pushing a tag vX.Y.Z runs them, then
# publishes the image to this Forgejo instance's container registry, tagged X.Y.Z, the commit SHA
# and latest.
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # A model change without its migration fails here rather than at the operator's first start.
      - name: Migrations match the model
        run: |
          dotnet tool restore
          dotnet restore
          dotnet ef migrations has-pending-model-changes --project src/Pollyanna

      # Every test host watches files (config, wwwroot, asp-append-version). The job runs as root
      # and shares the runner host's per-user inotify limit (often 128), which parallel tests
      # exhaust; polling avoids inotify altogether.
      - name: Test
        env:
          DOTNET_USE_POLLING_FILE_WATCHER: '1'
        run: dotnet test

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The SDK builds the image and talks to the registry API itself; no Docker daemon needed.
      # Registry, repository and the source and documentation labels come from this Forgejo
      # instance and repo, never from the source.
      # REGISTRY_TOKEN is a repo secret: an access token with package write permission.
      - name: Build and push image
        env:
          DOTNET_CONTAINER_REGISTRY_UNAME: ${{ github.actor }}
          DOTNET_CONTAINER_REGISTRY_PWORD: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          registry="${GITHUB_SERVER_URL#*://}"
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          version="${GITHUB_REF_NAME#v}"
          source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          dotnet publish src/Pollyanna/Pollyanna.csproj \
            -c Release \
            -t:PublishContainer \
            -p:Version="$version" \
            -p:PublishRepositoryUrl=true \
            -p:PrivateRepositoryUrl="$source" \
            -p:ContainerDocumentationUrl="$source/src/tag/$GITHUB_REF_NAME/DEPLOYMENT.md" \
            -p:ContainerRegistry="$registry" \
            -p:ContainerRepository="$repository" \
            "-p:ContainerImageTags=\"$version;${GITHUB_SHA};latest\""
